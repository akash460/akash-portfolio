<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Square -->
  <rect x="1" y="1" width="30" height="30" rx="8" fill="url(#bg)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.8"/>
  
  <!-- Monogram A -->
  <path d="M10 24L16 6L22 24" stroke="#34d399" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M12.5 18H19.5" stroke="#34d399" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="16" cy="10" r="1.5" fill="#34d399"/>
</svg>
